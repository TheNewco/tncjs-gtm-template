  - sha: ffc3e9ea1cf696425e06a6cb644645ffab6135d4
    changeNotes: >-
      Reliable per-event delivery: each tag firing now sends its own
      self-contained hit (own event name, customer data and custom variables)
      instead of relying on a single automatic hit and shared state. Fixes
      missing custom variables and events dropped when multiple TNCiD tags fire
      on the same page load. dataLayer / window CustomEvent listeners are now
      registered per event name, so tags with different settings no longer
      block each other. Added README and implementation guide. Requires
      re-accepting the tag permissions.
